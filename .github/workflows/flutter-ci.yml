name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform projects
        run: |
          flutter create --platforms=android,ios --org com.qinghe --project-name qinghe_timetable .platform_template
          cp -R .platform_template/android ./android
          cp -R .platform_template/ios ./ios

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: |
          dart format lib test tool
          git diff --exit-code -- '*.dart'

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: timeout 10m flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: qinghe-timetable-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
